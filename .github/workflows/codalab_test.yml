name: Test CodaLab Python 3.7

on:
  workflow_dispatch:

jobs:
  test-codalab:
    runs-on: ubuntu-latest

    steps:
      - name: Pull CodaLab Docker image
        run: |
          docker pull codalab/codalab-legacy:py37

      - name: Inspect CodaLab environment
        run: |
          echo "========================================"
          echo "CodaLab Docker environment"
          echo "========================================"

          echo ""
          echo "Python:"
          docker run --rm \
            codalab/codalab-legacy:py37 \
            python --version

          echo ""
          echo "Python detailed version:"
          docker run --rm \
            codalab/codalab-legacy:py37 \
            python -c "import sys; print(sys.version)"

          echo ""
          echo "Pip:"
          docker run --rm \
            codalab/codalab-legacy:py37 \
            pip --version

          echo ""
          echo "========================================"
          echo "Important ML packages"
          echo "========================================"

          docker run --rm \
            codalab/codalab-legacy:py37 \
            python -c "
          modules = [
              'torch',
              'transformers',
              'peft',
              'tokenizers',
              'sentencepiece',
              'numpy',
              'pandas',
              'sklearn'
          ]

          for name in modules:
              try:
                  module = __import__(name)
                  version = getattr(module, '__version__', 'unknown')
                  print(name + ': OK - ' + str(version))
              except Exception as e:
                  print(name + ': FAIL - ' + repr(e))
          "

          echo ""
          echo "========================================"
          echo "DONE"
          echo "========================================"

name: ALTA CodaLab Test

on:
  workflow_dispatch:

jobs:
  alta-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ALTA project
        uses: actions/checkout@v6

      - name: Pull CodaLab image
        run: |
          docker pull codalab/codalab-legacy:py37

      - name: Show project files
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 2 -type f | sort | head -200

      - name: Test ALTA inside CodaLab container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            codalab/codalab-legacy:py37 \
            python -c "
          import sys
          print('Python:', sys.version)

          print('--- Testing imports ---')

          import torch
          print('torch:', torch.__version__)

          import transformers
          print('transformers:', transformers.__version__)

          try:
              import peft
              print('peft:', peft.__version__)
          except Exception as e:
              print('PEFT ERROR:', repr(e))

          import tokenizers
          print('tokenizers:', tokenizers.__version__)

          import sentencepiece
          print('sentencepiece: OK')

          import pandas
          print('pandas:', pandas.__version__)

          import numpy
          print('numpy:', numpy.__version__)

          print('')
          print('================================')
          print('ALTA ENVIRONMENT TEST PASSED')
          print('================================')
          "
